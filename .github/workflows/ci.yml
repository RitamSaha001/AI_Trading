name: CI Quality Gate & Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: lumen
          POSTGRES_PASSWORD: lumen_test_password
          POSTGRES_DB: lumen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    permissions:
      contents: read
      statuses: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & Syntax Validation
        run: npm run lint

      - name: Run Domain & Financial Unit Tests (with PostgreSQL CI Service)
        run: npm test
        env:
          TEST_DATABASE_URL: postgresql://lumen:lumen_test_password@localhost:5432/lumen_test
          DATABASE_URL: postgresql://lumen:lumen_test_password@localhost:5432/lumen_test

      - name: Production Bundle Compilation
        run: npm run build

      - name: Automated Financial Integrity & Fake-Money Audit
        run: npm run audit

      - name: Publish Verified Commit Status
        if: success()
        run: |
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github.v3+json" \
            "https://api.github.com/repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -d '{
              "state": "success",
              "target_url": "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}",
              "description": "CI Quality Gate & Financial Integrity Audit passed",
              "context": "ci/quality-gate"
            }'
