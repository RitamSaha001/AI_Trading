name: CI Quality Gate & Test Suite

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  verify:
    name: Lint, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: TypeScript & Syntax Validation
        run: npm run lint

      - name: Run Domain & Financial Unit Tests
        run: npm test

      - name: Production Bundle Compilation
        run: npm run build

      - name: Automated Financial Integrity & Fake-Money Audit
        run: npm run audit
